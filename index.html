<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevBrief — An independent, developer-focused technology journal & news feed.">
    <title>DevBrief — Independent Tech Journal</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">

    <!-- Stylesheets (Editorial Light Mode Edition) -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <!-- Publication Header -->
    <header class="header">
        <div class="app-container">
            <div class="header-inner">
                <div class="brand" onclick="location.hash='#feed'">
                    <span class="brand-title">DevBrief</span>
                    <span class="brand-tagline">Independent Tech Journal</span>
                </div>

                <nav class="header-nav" aria-label="Main Navigation">
                    <a href="#feed" class="nav-link active">Stories</a>
                    <a href="#about" class="nav-link">About</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Application Shell -->
    <main class="main-content">
        <div class="app-container">

            <!-- Lead Story Spotlight -->
            <div id="leadStoryContainer" style="display: none;">
                <!-- Rendered dynamically by JS -->
            </div>

            <!-- Control Bar (Search & Filter) -->
            <section class="control-bar" id="controlBarSection" aria-label="Search and Filter Stories">
                <div class="search-wrapper">
                    <div class="search-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search stories, titles, or domains... (Press '/' to focus)"
                        aria-label="Search stories"
                        autocomplete="off"
                    >
                    <button type="button" id="searchClearBtn" class="search-clear-btn" aria-label="Clear search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- Source Dropdown Filter -->
                <div class="dropdown" id="sourceDropdownContainer">
                    <button type="button" class="dropdown-toggle" id="sourceDropdownToggle" aria-haspopup="true" aria-expanded="false">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                        <span>Sources</span>
                        <span class="dropdown-badge" id="sourceDropdownBadge" style="display: none;">0</span>
                    </button>
                    <div class="dropdown-menu" id="sourceDropdownMenu" role="menu">
                        <div class="dropdown-header">
                            <span>Filter Publications</span>
                            <div>
                                <button type="button" class="dropdown-action-btn" id="selectAllSourcesBtn">Select all</button>
                                <span style="color: var(--border);">|</span>
                                <button type="button" class="dropdown-action-btn" id="clearSourcesBtn">Clear</button>
                            </div>
                        </div>
                        <div class="dropdown-body" id="sourceDropdownBody">
                            <!-- Populated dynamically by JS -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Active Filter Chips -->
            <div class="active-filters" id="activeFilterChips" style="display: none;">
                <!-- Renders filter chips -->
            </div>

            <!-- Category Navigation Bar -->
            <nav class="categories-nav" id="categoryNavSection" aria-label="Categories">
                <div id="categoryTabsContainer" style="display: flex; gap: 16px;"></div>
            </nav>

            <!-- Main Feed Section -->
            <section class="stories-section" aria-label="Stories Feed">
                <div class="stories-header" id="storiesHeaderBlock">
                    <h3 class="stories-title">Recent Stories</h3>
                    <div style="font-size: 0.8rem; color: var(--text-dim); display: flex; gap: 12px;">
                        <span id="storiesCountText">Loading stories...</span>
                        <span>•</span>
                        <span>Updated <strong id="statLastUpdated" style="color: var(--text-muted); font-family: var(--font-mono);">—</strong></span>
                    </div>
                </div>

                <div id="newsFeedContainer">
                    <!-- Rendered dynamically by JS -->
                </div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="app-container">
            <div class="footer-inner">
                <span>DevBrief — Independent Technology Aggregator</span>
                <span>Press <kbd class="footer-kbd">/</kbd> to search, <kbd class="footer-kbd">Esc</kbd> to clear</span>
            </div>
        </div>
    </footer>

    <!-- Application Scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/filters.js"></script>
    <script src="assets/js/stats.js"></script>
    <script src="assets/js/articles.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
